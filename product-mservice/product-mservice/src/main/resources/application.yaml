server:
  port: 8082

spring:
  application:
    name: product-mservice     # ← this is the name other services use to find it
  datasource:
    url: jdbc:h2:file:./data/productsdb

  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

