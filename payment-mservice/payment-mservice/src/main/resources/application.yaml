
server:
  port: 8084

spring:
  application:
    name: payment-mservice    # ← this is the name other services use to find it
  datasource:
    url: jdbc:h2:file:./data/paymentsdb

  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.microservicesprojectone.common_module.events.OrderEvent


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/   # ← points to our registry

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans